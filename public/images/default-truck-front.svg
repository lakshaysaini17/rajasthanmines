<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="100%" height="100%">
  <defs>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f18"/>
      <stop offset="60%" stop-color="#141c28"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <radialGradient id="headlightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="truckCab" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Background / Weighbridge Bay -->
  <rect width="640" height="480" fill="url(#nightSky)"/>
  
  <!-- Weighbridge Floor / Platform -->
  <polygon points="0,320 640,320 640,480 0,480" fill="url(#road)"/>
  <line x1="0" y1="360" x2="640" y2="360" stroke="#475569" stroke-width="3" stroke-dasharray="15,10"/>
  <line x1="0" y1="420" x2="640" y2="420" stroke="#475569" stroke-width="2"/>

  <!-- Truck Cab Front View -->
  <!-- Main Cab Body -->
  <rect x="180" y="110" width="280" height="240" rx="16" fill="url(#truckCab)" stroke="#0f172a" stroke-width="4"/>
  
  <!-- Windshield -->
  <rect x="200" y="130" width="240" height="90" rx="8" fill="#0f172a" stroke="#334155" stroke-width="3"/>
  <path d="M210 140 L300 140 L280 200 L210 200 Z" fill="#1e293b" opacity="0.6"/>

  <!-- Sun Visor / Top Sign -->
  <rect x="210" y="115" width="220" height="22" rx="4" fill="#0f172a"/>
  <text x="320" y="130" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="900" letter-spacing="4" fill="#f8fafc" text-anchor="middle">BHARATBENZ</text>

  <!-- Front Grille -->
  <rect x="220" y="240" width="200" height="85" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <line x1="230" y1="255" x2="410" y2="255" stroke="#475569" stroke-width="3"/>
  <line x1="230" y1="270" x2="410" y2="270" stroke="#475569" stroke-width="3"/>
  <line x1="230" y1="285" x2="410" y2="285" stroke="#475569" stroke-width="3"/>
  <line x1="230" y1="300" x2="410" y2="300" stroke="#475569" stroke-width="3"/>

  <!-- Brand Emblem on Grille -->
  <circle cx="320" cy="275" r="14" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
  <polygon points="320,264 324,275 333,275 326,280 329,289 320,283 311,289 314,280 307,275 316,275" fill="#0f172a"/>

  <!-- Headlights Glow & Lamps -->
  <!-- Left Headlight -->
  <circle cx="205" cy="300" r="45" fill="url(#headlightGlow)"/>
  <rect x="188" y="285" width="34" height="30" rx="6" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
  
  <!-- Right Headlight -->
  <circle cx="435" cy="300" r="45" fill="url(#headlightGlow)"/>
  <rect x="418" y="285" width="34" height="30" rx="6" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>

  <!-- Bumper -->
  <rect x="160" y="325" width="320" height="40" rx="8" fill="#0f172a"/>
  
  <!-- License Number Plate -->
  <rect x="270" y="332" width="100" height="26" rx="3" fill="#facc15" stroke="#000000" stroke-width="2"/>
  <text x="320" y="350" font-family="'Courier New', monospace" font-size="14" font-weight="900" fill="#000000" text-anchor="middle">HR55AT1748</text>

  <!-- Side Mirrors -->
  <rect x="155" y="145" width="20" height="50" rx="4" fill="#0f172a"/>
  <rect x="465" y="145" width="20" height="50" rx="4" fill="#0f172a"/>

  <!-- CCTV Metadata Overlay -->
  <rect x="0" y="0" width="640" height="28" fill="#000000" opacity="0.75"/>
  <text x="15" y="18" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#22c55e">WB-CAM01 [FRONT] • 2026-07-02 02:17:58</text>
  <text x="625" y="18" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#e2e8f0" text-anchor="end">FPS: 25.0 REC ●</text>

  <!-- Front Image badge placeholder -->
  <rect x="16" y="40" width="120" height="30" rx="4" fill="#000000" stroke="#ffffff" stroke-width="1.5"/>
  <text x="76" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Front Image</text>

  <text x="625" y="465" font-family="'Courier New', monospace" font-size="11" fill="#94a3b8" text-anchor="end">CP IP Cam</text>
</svg>
